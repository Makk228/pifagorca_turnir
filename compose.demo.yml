name: schitay-demo
services:
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:h2:file:/app/data/schitay;NON_KEYWORDS=DAY,VALUE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      DEMO_DATA: "true"
      MAIL_MODE: smtp
      MAIL_FROM: demo@schitay.local
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
    volumes: [demo_data:/app/data]
    depends_on: [mailpit]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
volumes:
  demo_data: {}
