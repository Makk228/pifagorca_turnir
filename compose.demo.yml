name: schitay-demo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schitay
      POSTGRES_USER: schitay
      POSTGRES_PASSWORD: local-demo-only
    volumes: ["demo_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U schitay -d schitay"]
      interval: 5s
      retries: 15
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://db:5432/schitay
      DATABASE_USER: schitay
      DATABASE_PASSWORD: local-demo-only
      DEMO_DATA: "true"
      SMS_MODE: local
    depends_on:
      db:
        condition: service_healthy
volumes:
  demo_postgres: {}
