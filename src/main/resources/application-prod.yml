spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:/data/schitay;NON_KEYWORDS=DAY,VALUE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
app:
  mail-mode: ${MAIL_MODE:smtp}
  demo: false
